services:
  equip_lease_db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: equip_lease_db
    ports:
      - '1433:1433'
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=StrongPassword2026!
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'StrongPassword2026!' -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - equip_lease_db:/var/opt/mssql

volumes:
  equip_lease_db:
    driver: local
